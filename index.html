<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030202" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>万锦🎰老虎机 - TP制作</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <img
      id="portrait-frame"
      class="portrait-only"
      src="royale_slot_portrait_transparent.webp"
      alt=""
      draggable="false"
    />

    <div id="portrait-hud" class="portrait-only">
      <div id="hud-jackpot">🏵️ Jackpot —</div>
      <div id="hud-message">READY TO SPIN</div>
      <button type="button" id="hud-lever" aria-label="拉杆"></button>
      <div id="hud-balance">
        <span class="hud-label">BALANCE</span>
        <span class="hud-value" id="hud-balance-val">1000</span>
      </div>
      <div id="hud-bet">
        <span class="hud-label">BET</span>
        <span class="hud-value" id="hud-bet-val">50</span>
      </div>
      <div id="hud-lastwin">
        <span class="hud-label">LAST WIN</span>
        <span class="hud-value" id="hud-lastwin-val">0</span>
      </div>
    </div>

    <div id="game-wrapper">
      <div id="game"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="config.js"></script>
    <script src="layout.js"></script>
    <script src="sound-fx.js"></script>
    <script src="bg-music.js"></script>
    <script src="slot-game.js"></script>
    <script src="app.js"></script>
  </body>
</html>
